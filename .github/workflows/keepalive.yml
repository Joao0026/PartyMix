name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 70 https://partymix-v2.onrender.com/api/health)
          echo "status=$code"
          cat /tmp/health.json
          test "$code" = "200"
